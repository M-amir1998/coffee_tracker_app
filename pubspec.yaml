name: coffee_tracker
description: "Coffee Tracker - shared coffee accounting for research groups"
publish_to: 'none'

# build-name / build-number can be overridden with --build-name and --build-number.
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  connectivity_plus: ^7.3.2
  fl_chart: ^1.3.0
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  intl: ^0.20.3
  material_ui: ^1.8.0
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.18.3
  uuid: ^4.6.0
  file_selector: ^1.1.0
  share_plus: ^13.3.1
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2
  http: ^1.6.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/fonts/OFL-Inter.txt
    - assets/fonts/OFL-Fraunces.txt

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Fraunces-Bold.ttf
          weight: 700
